<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <meta name="theme-color" content="#f7f4ec">
    <link rel="icon" type="image/png" href="{{ SITEURL }}/theme/assets/byteray-mark.png">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css{% if CSS_VERSION %}?v={{ CSS_VERSION }}{% endif %}">
    {% if FEED_ALL_ATOM %}
    <link href="{{ FEED_DOMAIN }}/{{ FEED_ALL_ATOM }}" type="application/atom+xml" rel="alternate" title="{{ SITENAME }} Atom Feed">
    {% endif %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <nav class="nav" aria-label="Main navigation">
        <a class="nav-brand" href="{{ SITEURL }}/">
            <span class="name" aria-label="ByteRay"><span class="byte">BYTE</span><span class="ray">RAY</span></span>
            <span class="blog-label">Blog</span>
        </a>
        <div class="nav-links">
            <a href="{{ SITEURL }}/">Posts</a>
            <a href="https://pop.byteray.co.uk/">Evidence &#8599;</a>
            <a href="https://byteray.co.uk/">ByteRay &#8599;</a>
        </div>
    </nav>

    <main id="main-content" tabindex="-1">
        {% block body %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <a class="mark" href="https://byteray.co.uk/">ByteRay &nearr;</a>
            <p>&copy; ByteRay Ltd. &mdash; security and engineering notes.</p>
        </div>
    </footer>
</body>
</html>
